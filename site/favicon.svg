<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>NAS Dashboard</title>
  <!-- Use the network blue; solid bays and broad gaps stay legible at 16px. -->
  <rect width="32" height="32" rx="7" fill="#2a82c2" />
  <rect x="4" y="4" width="24" height="24" rx="3" fill="#fff" />
  <g fill="#2a82c2">
    <rect x="7" y="7" width="8" height="18" rx="1.5" />
    <rect x="17" y="7" width="8" height="18" rx="1.5" />
  </g>
  <g fill="#fff">
    <circle cx="11" cy="10" r="1" />
    <circle cx="21" cy="10" r="1" />
    <rect x="9" y="20" width="4" height="2" rx="1" />
    <rect x="19" y="20" width="4" height="2" rx="1" />
  </g>
</svg>
